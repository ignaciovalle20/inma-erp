name: DB migrations

# Applies supabase/migrations to the matching Supabase project:
#   push to `dev`  -> DEV project   (sczgankronafrxybpvnh)
#   push to `main` -> PROD project  (jxkfpkgyvjiyufmfxsfp)
#
# INACTIVE until it is switched on: the job is skipped unless the repository
# variable DB_MIGRATIONS_ENABLED is 'true'. Setup steps (environments, secrets,
# prod approval) are in README.md, section "Entornos".
#
# It only runs `db push`: pending migrations, in order. It never seeds
# (`--include-seed` is not used, and seed.sql refuses to run on prod anyway),
# never resets, and never repairs the migration history.

on:
  push:
    branches: [dev, main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/db-migrations.yml"
  # Manual re-run, e.g. after fixing a failed migration or the secrets.
  workflow_dispatch:

permissions:
  contents: read

# One migration run per branch at a time, and never cancel one halfway.
concurrency:
  group: db-migrations-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply migrations (${{ github.ref_name == 'main' && 'prod' || 'dev' }})
    if: ${{ vars.DB_MIGRATIONS_ENABLED == 'true' && (github.ref_name == 'dev' || github.ref_name == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Each environment holds its own SUPABASE_ACCESS_TOKEN and
    # SUPABASE_DB_PASSWORD. Put "required reviewers" on `production` so a merge
    # to main waits for a human before touching prod data.
    environment: ${{ github.ref_name == 'main' && 'production' || 'dev' }}
    env:
      # Project refs are identifiers, not secrets. Hard-coded so a branch can
      # never be pointed at the other environment by a misconfigured variable.
      PROJECT_REF: ${{ github.ref_name == 'main' && 'jxkfpkgyvjiyufmfxsfp' || 'sczgankronafrxybpvnh' }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Check secrets are present
        run: |
          missing=0
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is empty in this environment"
              missing=1
            fi
          done
          exit $missing

      - name: Link project
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Migrations before
        run: supabase migration list --linked

      - name: Dry run
        run: supabase db push --dry-run

      - name: Push migrations
        run: supabase db push --yes

      - name: Migrations after
        run: supabase migration list --linked
